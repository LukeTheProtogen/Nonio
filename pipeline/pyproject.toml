[project]
name = "nonio-pipeline"
version = "0.1.0"
description = "Ingestão e modelagem do Nônio: Focus, SGS, CVM e cotações"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.4.0",
    "curl-cffi>=0.16.3",
    "duckdb>=1.5.5",
    "lightgbm>=4.7.0",
    "nonio-backend",
    "numpy>=2.5.2",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "yfinance>=1.7.0",
]

[project.optional-dependencies]
# Nenhum destes é instalado por padrão. O código importa sob demanda e, se
# faltar, diz qual comando resolve.
openai = ["openai>=3.8.0"]      # cobre também Groq, Together, OpenRouter,
                                 # DeepSeek, Fireworks, vLLM, Ollama, LM Studio
google = ["google-genai>=2.22.0"]
todos  = ["openai>=3.8.0", "google-genai>=2.22.0"]

[tool.uv.sources]
nonio-backend = { path = "../backend", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nonio"]
