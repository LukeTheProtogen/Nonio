<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<title>Carrossel Nônio</title>
<style>
  body{margin:0;background:#1b201d;font:14px/1.5 -apple-system,system-ui,sans-serif;color:#c9d0ca;padding:40px}
  h1{font-size:18px;font-weight:600;margin:0 0 4px;color:#f0f2ee}
  p{margin:0 0 32px;color:#8e9a92}
  .tira{display:flex;gap:2px;overflow-x:auto;padding-bottom:20px}
  .tira img{width:420px;height:auto;display:block;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .rot{display:flex;gap:2px;margin-top:10px}
  .rot span{width:420px;font-size:12px;color:#8e9a92;font-family:ui-monospace,monospace}
  .um{margin-top:48px}
  .um img{width:100%;max-width:520px;display:block;box-shadow:0 8px 30px rgba(0,0,0,.4);margin-bottom:24px}
</style></head><body>
<h1>Carrossel · 3 slides · 1080×1350</h1>
<p>A tira mostra a continuidade: a régua atravessa os três cortes na mesma altura.</p>
<div class="tira">
  <img src="slide-1.png"><img src="slide-2.png"><img src="slide-3.png">
</div>
<div class="rot"><span>1 · o número</span><span>2 · o achado</span><span>3 · o produto + CTA</span></div>
<div class="um">
  <h1>Como aparece no feed, um a um</h1>
  <p>É assim que a maioria vê. Cada slide precisa se sustentar sozinho.</p>
  <img src="slide-1.png"><img src="slide-2.png"><img src="slide-3.png">
</div>
</body></html>
