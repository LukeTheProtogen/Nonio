<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Nônio">
  <!--
    Ícone do iOS. Aqui o fundo é OBRIGATÓRIO: a Safari recorta em quadrado
    arredondado e transparência vira preto.

    O raio é 44 de 180, a mesma proporção do sistema, e o desenho fica dentro
    com folga: iOS aplica a própria máscara por cima, e arte encostada na borda
    perde os cantos.
  -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1c5f55" />
      <stop offset="1" stop-color="#0a3129" />
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="44" fill="url(#fundo)" />
  <g transform="translate(90 90) scale(1.35) translate(-50 -50)">
    <path d="M47 8 C33 25 21 38 21 55 C21 72 32 82 47 84 Z" fill="#ffffff" opacity="0.96" />
    <path d="M53 92 C67 75 79 62 79 45 C79 28 68 18 53 16 Z" fill="#ffffff" opacity="0.66" />
  </g>
</svg>
