<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Nônio">
  <title>Nônio</title>
  <!--
    O glifo: uma folha e a MESMA folha girada 180 graus em torno do centro.

    A construção não é decorativa. É a ideia do produto em geometria: duas
    escalas idênticas, deslocadas uma da outra, e a leitura nasce de onde elas
    se encontram. É o paquímetro, sem desenhar um paquímetro.

    Por isso os dois lobos são o mesmo caminho: se um mudar, o outro muda junto,
    e a simetria nunca sai do lugar por descuido.

    A fenda vertical no meio (x 49 a 51) é o vão entre as escalas. Sem ela as
    duas metades viram uma mancha só.
  -->
  <path d="M47 8 C33 25 21 38 21 55 C21 72 32 82 47 84 Z" fill="currentColor" />
  <path d="M53 92 C67 75 79 62 79 45 C79 28 68 18 53 16 Z" fill="currentColor" opacity="0.62" />
</svg>
