<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Nônio">
  <title>Nônio</title>
  <!--
    Ícone de aplicativo, 512×512. É deste arquivo que saem os PNG das lojas e
    do manifest — SVG é a fonte, PNG é derivado, e derivado se regera.

    Raio 120 de 512: a mesma proporção do quadrado arredondado do iOS (~23,5%),
    então o desenho não briga com a máscara que o sistema aplica por cima.
  -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1c5f55" />
      <stop offset="1" stop-color="#0a3129" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#fundo)" />
  <g transform="translate(256 256) scale(3.8) translate(-50 -50)">
    <path d="M47 8 C33 25 21 38 21 55 C21 72 32 82 47 84 Z" fill="#ffffff" opacity="0.96" />
    <path d="M53 92 C67 75 79 62 79 45 C79 28 68 18 53 16 Z" fill="#ffffff" opacity="0.66" />
  </g>
</svg>
