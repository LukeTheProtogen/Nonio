[project]
name = "nonio-backend"
version = "0.1.0"
description = "API FastAPI do Nônio: stocks, previews e serviços"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "duckdb-sqlalchemy>=1.5.5",
    "fastapi>=0.115.0",
    "polars>=1.44.1",
    "pydantic-settings>=2.8.0",
    "pyarrow>=25.0.1",
    "sqlalchemy>=2.0.40",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
